<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-6 py-12">
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Connexion</h2>

    <form (submit)="submitLogin(); $event.preventDefault()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input [(ngModel)]="user.email" name="email" type="email" required
               class="mt-1 block w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
        <input [(ngModel)]="user.password" name="password" type="password" required
               class="mt-1 block w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
        Se connecter
      </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
      Vous n’avez pas de compte ?
      <button class="text-indigo-600 hover:underline ml-1">Créer un compte</button>
    </p>
  </div>

  <footer class="mt-12 text-sm text-gray-500">
    &copy; 2025 - Application Angular Android
  </footer>
</div>
