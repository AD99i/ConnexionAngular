<div class="min-h-screen bg-white flex flex-col items-center justify-center px-6 py-12">
  <div class="w-full max-w-lg bg-gray-100 shadow-md rounded-lg p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Contactez-nous</h2>

    <form (submit)="sendMessage(); $event.preventDefault()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nom</label>
        <input [(ngModel)]="contact.name" name="name" type="text" class="mt-1 block w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input [(ngModel)]="contact.email" name="email" type="email" class="mt-1 block w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Message</label>
        <textarea [(ngModel)]="contact.message" name="message" rows="4" class="mt-1 block w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
        Envoyer
      </button>
    </form>
  </div>

  <footer class="mt-12 text-sm text-gray-500">
    &copy; 2025 - Application Angular Android
  </footer>
</div>
